name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "deploy builds and releases main; rollback switches the server back to an earlier release"
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      release:
        description: "Rollback only: release directory name to switch to (empty = the one before the current release)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  # Same PHP version as the production server, which runs the release.
  PHP_VERSION: "8.5"
  NODE_VERSION: "22"

jobs:
  ci:
    name: Test and build
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: droppie_test
          MARIADB_USER: droppie
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, curl, zip, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

      - name: Build frontend
        run: npm run build

      - name: Prepare production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Record release version
        # Read by config/sentry.php as the Sentry release; travels to the server with the release.
        run: echo "${GITHUB_SHA::7}" > REVISION

      - name: Package release
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude="storage" \
            --exclude="bootstrap/cache" \
            -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-release
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      KEEP_RELEASES: "5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: production-release

      - name: Set up SSH
        uses: ./.github/actions/production-ssh

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          # The deploy scripts ship inside the release itself.
          tar -xzf release.tar.gz ./deploy/release.sh ./deploy/rollback.sh

          # A private directory in the deploy user's home: /tmp may be shared on the host.
          # shellcheck disable=SC2086
          ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p -m 700 .droppie-deploy && chmod 700 .droppie-deploy"
          # shellcheck disable=SC2086
          scp $SSH_OPTS -P "$DEPLOY_PORT" release.tar.gz deploy/release.sh deploy/rollback.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:.droppie-deploy/"

      - name: Activate release
        id: activate
        shell: bash
        run: |
          set -euo pipefail
          release_name="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "Release: $release_name"

          # Prepares the release next to the live one and switches a symlink; on any failure before
          # the switch the current release keeps serving. See deploy/release.sh.
          # shellcheck disable=SC2086
          ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash .droppie-deploy/release.sh "$DEPLOY_PATH" .droppie-deploy/release.tar.gz "$release_name" "$KEEP_RELEASES"

      - name: Check application health
        id: health
        if: ${{ env.PRODUCTION_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 20 \
            "${PRODUCTION_URL%/}/up"

      - name: Roll back to the previous release
        # Only after the switch: if activation itself failed, the old release is still live.
        if: ${{ failure() && steps.health.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::The new release failed its health check; switching back to the previous release."
          # shellcheck disable=SC2086
          ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash .droppie-deploy/rollback.sh "$DEPLOY_PATH"

  rollback:
    name: Roll back
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      TARGET_RELEASE: ${{ inputs.release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            deploy

      - name: Set up SSH
        uses: ./.github/actions/production-ssh

      - name: Switch release
        shell: bash
        run: |
          set -euo pipefail
          # A private directory in the deploy user's home: /tmp may be shared on the host.
          # shellcheck disable=SC2086
          ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p -m 700 .droppie-deploy && chmod 700 .droppie-deploy"
          # shellcheck disable=SC2086
          scp $SSH_OPTS -P "$DEPLOY_PORT" deploy/rollback.sh "$DEPLOY_USER@$DEPLOY_HOST:.droppie-deploy/rollback.sh"
          # shellcheck disable=SC2086
          ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash .droppie-deploy/rollback.sh "$DEPLOY_PATH" "$TARGET_RELEASE"

      - name: Check application health
        if: ${{ env.PRODUCTION_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 \
            "${PRODUCTION_URL%/}/up"
