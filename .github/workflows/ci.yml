name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  ci:
    name: Test and build (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Production runs PHP 8.5; composer.json still allows 8.3, so both are tested.
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: droppie_test
          MARIADB_USER: droppie
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, zip, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

      - name: Build frontend
        run: npm run build
